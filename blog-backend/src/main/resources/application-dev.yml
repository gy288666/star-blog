spring:
  datasource:
    url: jdbc:mysql://localhost:3306/blog?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    # 仅本地开发默认值，可用环境变量 DB_PASSWORD 覆盖
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

# dev profile 专用：本机开发用的默认签名密钥（生产走 application-prod.yml + JWT_SECRET，不含默认值）
blog:
  jwt-secret: dev-only-secret-change-me-please-0123456789

logging:
  level:
    com.blog.mapper: debug

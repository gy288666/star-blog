spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:blog}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

logging:
  level:
    com.blog.mapper: warn

blog:
  # 生产必须显式提供 JWT_SECRET；未设置时占位符无法解析，应用启动失败（不回退到 dev 默认密钥）
  jwt-secret: ${JWT_SECRET}

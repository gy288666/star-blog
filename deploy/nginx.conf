# 博客站点反代（部署时放 /etc/nginx/conf.d/default.conf）
# SSL 证书放 deploy/ssl/：fullchain.pem + privkey.pem（certbot --webroot 签发）

# 未配置证书前的 HTTP 入口（同时承担 certbot webroot 验证）
server {
    listen 80;
    server_name blog.20260006.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 证书就绪后自动跳转 HTTPS（证书未就绪时注释掉下面一行）
    # return 301 https://$host$request_uri;

    include /etc/nginx/conf.d/blog_proxy.inc;
}

